spring.application.name=OnlineBookStoreRestfullApi

spring.profiles.active=prod

# ================= DATABASE =================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Spring keeps DB session open during request rendering.
spring.jpa.open-in-view=false

# Hikari tuning for Supabase free tier
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=update

# ================= JWT CONFIG =================

jwt.key=${JWT_SECRET}

jwt.issuer=online-book-store

access.ttl.seconds=987
refresh.ttl.seconds=60898900

jwt.cookie.name=refreshToken
jwt.cookie.secure=true
jwt.cookie.same.site=None
jwt.cookie.http.only=true
jwt.cookie.domain=

# ================= RAZORPAY =================

razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# ================= FILE UPLOAD =================

spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

# ================= CLOUDINARY =================

cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api_key=${CLOUDINARY_API_KEY}
cloudinary.api_secret=${CLOUDINARY_API_SECRET}

app.frontend.url=https://online-book-store-frontend-ten.vercel.app

# here is redis configurations

spring.data.redis.host={REDIS_HOST}
spring.data.redis.port=6379
spring.data.redis.password={REDIS_PASSWORD}
spring.data.redis.ssl.enabled=true
spring.data.redis.timeout=6000ms
spring.data.redis.connect-timeout=6000ms

# Here is the Auth02Service
spring.security.oauth2.client.registration.google.client-id={GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret={GOOGLE_CLIENT_SECRET}

spring.security.oauth2.client.registration.google.scope=openid,profile,email